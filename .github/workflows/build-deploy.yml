name: Build and Deploy MiroFish

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.spooty.io
  IMAGE_NAME: library/mirofish

jobs:
  build-and-push:
    name: Build and Push Multiarch Image
    runs-on: stax-builder
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Harbor
        run: |
          : "${HARBOR_USERNAME:?stax-builder runner must inject HARBOR_USERNAME from devops/harbor-ci-push-secret}"
          : "${HARBOR_PASSWORD:?stax-builder runner must inject HARBOR_PASSWORD from devops/harbor-ci-push-secret}"
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multiarch image
        id: image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  test:
    name: Run Tests
    runs-on: stax-builder
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust toolchain for tiktoken fallback builds
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync

      - name: Run backend tests
        working-directory: backend
        run: |
          uv run pytest

  promote-gitops:
    name: Promote image through ArgoCD GitOps
    needs: [build-and-push, test]
    runs-on: stax-general
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: apps

      - name: Checkout apps repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/apps
          path: apps
          token: ${{ steps.app-token.outputs.token }}

      - name: Promote immutable image to apps repo
        working-directory: apps
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          mkdir -p deployments/08-ai/llm/mirofish
          cat > deployments/08-ai/llm/mirofish/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources: [deployment.yaml, service.yaml]
          EOF
          cat > deployments/08-ai/llm/mirofish/deployment.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mirofish
            labels:
              app: mirofish
              app.kubernetes.io/instance: 08-ai-llm-mirofish
          spec:
            replicas: 1
            selector:
              matchLabels: {app: mirofish}
            template:
              metadata:
                labels:
                  app: mirofish
                  app.kubernetes.io/instance: 08-ai-llm-mirofish
              spec:
                imagePullSecrets: [{name: harbor-pull-secret}]
                containers:
                  - name: mirofish
                    image: ${HARBOR_REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}
                    ports: [{name: http, containerPort: 5001}]
                    env:
                      - {name: FLASK_ENV, value: production}
                      - {name: FLASK_DEBUG, value: "0"}
                      - {name: FLASK_APP, value: backend/run.py}
                      - {name: DATA_DIR, value: /data}
                      - {name: USE_ZEP, value: "false"}
                      - {name: LITELLM_BASE_URL, value: http://control-plane.aegis-ai.svc.cluster.local:8080/v1}
                      - {name: LITELLM_API_KEY, value: sk-internal}
                      - {name: LITELLM_MODEL, value: qwen35-coder}
                    readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20}
                    livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 45}
                    volumeMounts: [{name: data, mountPath: /data}]
                volumes: [{name: data, emptyDir: {}}]
          EOF
          cat > deployments/08-ai/llm/mirofish/service.yaml <<'EOF'
          apiVersion: v1
          kind: Service
          metadata:
            name: mirofish-backend
            labels: {app: mirofish, app.kubernetes.io/instance: 08-ai-llm-mirofish}
          spec:
            selector: {app: mirofish}
            ports: [{name: http, port: 5001, targetPort: http}]
          EOF
          git add deployments/08-ai/llm/mirofish
          git commit -m "feat: promote MiroFish image through ArgoCD"
          git push origin HEAD:main
