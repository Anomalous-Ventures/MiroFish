name: Build and Deploy MiroFish

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.spooty.io
  IMAGE_NAME: library/mirofish

jobs:
  build-and-push:
    name: Build and Push Multiarch Image
    runs-on: stax-builder
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Harbor
        run: |
          : "${HARBOR_USERNAME:?stax-builder runner must inject HARBOR_USERNAME from devops/harbor-ci-push-secret}"
          : "${HARBOR_PASSWORD:?stax-builder runner must inject HARBOR_PASSWORD from devops/harbor-ci-push-secret}"
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multiarch image
        id: image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  test:
    name: Run Tests
    runs-on: stax-builder
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Rust toolchain for tiktoken fallback builds
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync

      - name: Run backend tests
        working-directory: backend
        run: |
          uv run pytest

  promote-gitops:
    name: Promote image through ArgoCD GitOps
    needs: [build-and-push, test]
    runs-on: stax-general
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Mint Apps checks reader token
        id: checks-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: apps
          permission-checks: read

      - name: Checkout apps repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/apps
          ref: main
          path: apps
          token: ${{ secrets.APPS_GITOPS_TOKEN }}

      - name: Promote immutable image to apps repo
        working-directory: apps
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("deployments/08-ai/llm/mirofish/deployment.yaml")
          prefix = "harbor.spooty.io/library/mirofish"
          pinned = f"{prefix}@{os.environ['IMAGE_DIGEST']}"
          pattern = re.compile(
              rf"^(\s*image:\s*){re.escape(prefix)}@sha256:[0-9a-f]{{64}}\s*$",
              re.MULTILINE,
          )
          updated, count = pattern.subn(rf"\g<1>{pinned}", path.read_text())
          if count != 1:
              raise SystemExit(
                  f"expected exactly one pinned MiroFish image in {path}; found {count}"
              )
          path.write_text(updated)
          PY

      - name: Create validated GitOps image PR
        working-directory: apps
        env:
          CHECKS_TOKEN: ${{ steps.checks-token.outputs.token }}
          GH_TOKEN: ${{ secrets.APPS_GITOPS_TOKEN }}
          PINNED_IMAGE: ${{ env.HARBOR_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          if git diff --quiet; then
            echo "MiroFish GitOps image already matches ${GITHUB_SHA}"
            exit 0
          fi

          branch="deploy/mirofish-${GITHUB_SHA}"
          title="Deploy MiroFish ${GITHUB_SHA}"
          body="Automated digest-only MiroFish promotion from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. Image: ${PINNED_IMAGE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/08-ai/llm/mirofish/deployment.yaml
          git commit -m "$title"
          remote_sha="$(git ls-remote --heads origin "$branch" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git push "--force-with-lease=refs/heads/${branch}:${remote_sha}" origin "HEAD:${branch}"
          else
            git push --force-with-lease origin "HEAD:${branch}"
          fi

          pr_number="$(gh api -X GET repos/Anomalous-Ventures/apps/pulls \
            -f state=open -f base=main -f head="Anomalous-Ventures:${branch}" \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api repos/Anomalous-Ventures/apps/pulls \
              -f title="$title" -f head="$branch" -f base=main -f body="$body" \
              --jq '.number')"
          fi
          echo "GitOps PR: https://github.com/Anomalous-Ventures/apps/pull/${pr_number}"

          head_sha="$(git rev-parse HEAD)"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            # shellcheck disable=SC2016
            check_line="$(GH_TOKEN="$CHECKS_TOKEN" gh api "repos/Anomalous-Ventures/apps/commits/${head_sha}/check-runs" \
              --jq '([.check_runs[] | select(.name == "Kustomize and static policy")] | sort_by(.started_at // "") | last) as $run | if $run == null then "" else [$run.status, ($run.conclusion // ""), $run.html_url] | @tsv end')"
            if [[ -n "$check_line" ]]; then
              IFS=$'\t' read -r check_status check_conclusion check_url <<< "$check_line"
              echo "Apps validation: ${check_status} ${check_conclusion} ${check_url}"
              if [[ "$check_status" == completed && "$check_conclusion" == success ]]; then
                break
              fi
              if [[ "$check_status" == completed ]]; then
                echo "::error::Apps validation failed: ${check_conclusion}"
                exit 1
              fi
            fi
            sleep 10
          done

          if [[ "${check_status:-}" != completed || "${check_conclusion:-}" != success ]]; then
            echo "::error::Timed out waiting for Apps validation"
            exit 1
          fi
          gh pr merge "$pr_number" --repo Anomalous-Ventures/apps --squash \
            --subject "$title" --body "Merged after Apps static policy validation passed."
